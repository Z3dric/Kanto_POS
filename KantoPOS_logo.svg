<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="#0D47A1" opacity="0.95"/>
  
  <!-- Gradient overlay for depth -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1565C0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0D47A1;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFB300;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF9800;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <circle cx="100" cy="100" r="95" fill="url(#grad1)"/>
  
  <!-- Main "K" shape -->
  <g transform="translate(100, 100)">
    <!-- Vertical line of K -->
    <rect x="-12" y="-45" width="16" height="90" fill="white" rx="4"/>
    
    <!-- Top diagonal of K -->
    <path d="M -12 -20 L 35 -45 L 28 -30 L -8 -10" fill="white" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Bottom diagonal of K -->
    <path d="M -12 15 L 35 45 L 28 30 L -8 10" fill="white" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Receipt/Transaction symbol integrated into K -->
    <g transform="translate(25, 0)">
      <!-- Receipt lines (simplified) -->
      <line x1="-5" y1="-15" x2="5" y2="-15" stroke="url(#grad2)" stroke-width="3" stroke-linecap="round"/>
      <line x1="-5" y1="-5" x2="5" y2="-5" stroke="url(#grad2)" stroke-width="3" stroke-linecap="round"/>
      <line x1="-5" y1="5" x2="5" y2="5" stroke="url(#grad2)" stroke-width="3" stroke-linecap="round"/>
      
      <!-- Checkmark (success indicator) -->
      <path d="M -2 18 L 2 23 L 8 15" stroke="url(#grad2)" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
  
  <!-- Text: KantoPOS (optional, can be added below logo) -->
  <text x="100" y="175" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="white" text-anchor="middle" letter-spacing="1">
    KantoPOS
  </text>
</svg>