<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="#1E88E5" opacity="0.1" stroke="#1E88E5" stroke-width="2"/>
  
  <!-- Main logo shape - shopping cart with POS elements -->
  <g transform="translate(100, 100)">
    <!-- Cart body -->
    <path d="M -45 -20 L -50 20 Q -50 30 -40 30 L 40 30 Q 50 30 50 20 L 45 -20 Z" 
          fill="none" stroke="#1E88E5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Cart handle -->
    <path d="M -35 -20 Q -35 -45 0 -50 Q 35 -45 35 -20" 
          fill="none" stroke="#1E88E5" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Shopping items in cart -->
    <rect x="-30" y="-5" width="15" height="20" fill="#FF6B6B" rx="2" opacity="0.8"/>
    <rect x="-5" y="-8" width="15" height="23" fill="#4ECDC4" rx="2" opacity="0.8"/>
    <rect x="20" y="-5" width="15" height="20" fill="#FFE66D" rx="2" opacity="0.8"/>
    
    <!-- POS indicator - small screen -->
    <rect x="-15" y="40" width="30" height="20" fill="#1E88E5" rx="2"/>
    <rect x="-13" y="42" width="26" height="14" fill="#E3F2FD"/>
    <line x1="-10" y1="45" x2="8" y2="45" stroke="#1E88E5" stroke-width="1"/>
    <line x1="-10" y1="48" x2="8" y2="48" stroke="#1E88E5" stroke-width="1"/>
  </g>
  
  <!-- Wheels -->
  <circle cx="65" cy="145" r="6" fill="none" stroke="#1E88E5" stroke-width="2"/>
  <circle cx="135" cy="145" r="6" fill="none" stroke="#1E88E5" stroke-width="2"/>
</svg>
